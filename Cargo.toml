[package]
name = "sol-rpc-mini"
version = "0.3.1"
edition = "2021"
description = "Minimal JSON-RPC client for Solana (no sdk dependency)"
license = "MIT"

[workspace]
members = [".", "det-macros"]

[dependencies]
det-macros = { path = "det-macros", version = "0.3.1" }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
